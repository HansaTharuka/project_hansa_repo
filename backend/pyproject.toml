[project]
name = "wealthwise-backend"
version = "0.1.0"
description = "WealthWise goal-based investment advisory platform — FastAPI backend."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "detect-secrets>=1.5",
]

# The project is imported as `src.<layer>.<module>` from the `backend/` root rather than
# installed with `src` as the package source root. A top-level package named `types`
# shadows the Python standard library's `types` module — which `enum`, `re` and
# `dataclasses` import during interpreter start-up — and breaks the interpreter outright.
# See the deviation note in the group A hand-off; folder-structure.md §2's import-path
# note needs an amendment before `db/` and `app/` land in E1-S3.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "."
explicit_package_bases = true
namespace_packages = true
warn_unreachable = true
disallow_any_unimported = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ANN"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.coverage.run]
source = ["src"]
